<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ассистент по ИР фотографированию</title>
    <style>
        :root {
            --primary-color: #0d1b2a;
            --bg-color: #000814;
            --chat-bg: rgba(13, 27, 42, 0.88);
            --bot-msg-bg: #1b263b;
            --user-msg-bg: #415a77;
            --text-color: #ffffff;
        }

        body {
            font-family: Calibri, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 720px;
            background-color: var(--chat-bg);
            background-image: linear-gradient(rgba(13, 27, 42, 0.6), rgba(13, 27, 42, 0.6)), url('image.png');
            background-size: cover;
            background-position: center;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #415a77;
        }

        .chat-header {
            background: #0d1b2a;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 19px;
            border-bottom: 1px solid #415a77;
            font-family: Calibri, "Helvetica Neue", Arial, sans-serif;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 14px;
            max-width: 90%;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
            font-family: Calibri, "Helvetica Neue", Arial, sans-serif;
        }

        .user-message {
            background: var(--user-msg-bg);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
            border: 1px solid #778da9;
        }

        .bot-message {
            background: var(--bot-msg-bg);
            color: #f1f1f1;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            white-space: pre-line;
            border: 1px solid #415a77;
        }

        /* Контейнер для тегов внутри сообщений бота */
        .inline-tags {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 10px;
        }

        .inline-tag-btn {
            background: #0d1b2a;
            color: #ffffff;
            border: 1px solid #415a77;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            transition: background 0.2s, border-color 0.2s;
            font-family: Calibri, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.3;
        }

        .inline-tag-btn:hover {
            background: #415a77;
            border-color: #778da9;
        }

        .reset-btn {
            background: #1b263b;
            color: #e0e1dd;
            border: 1px solid #778da9;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 8px;
            font-weight: bold;
            font-family: Calibri, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
        }

        .reset-btn:hover {
            background: #415a77;
            color: #ffffff;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">Ассистент по ИР фотографированию</div>
    
    <div class="chat-box" id="chatBox">
        <!-- Стартовое сообщение с выбором основных разделов из таблицы -->
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');

    // Функция добавления сообщений
    function addMessage(text, sender, htmlButtons = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender === 'user' ? 'user-message' : 'bot-message'}`;
        msgDiv.textContent = text;
        
        if (htmlButtons) {
            const btnContainer = document.createElement('div');
            btnContainer.className = 'inline-tags';
            btnContainer.innerHTML = htmlButtons;
            msgDiv.appendChild(btnContainer);
        }

        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // Главное меню (шаг 1)
    function startMenu() {
        const buttons = `
            <button class="inline-tag-btn" onclick="selectCategory('КСО')">📦 КСО</button>
            <button class="inline-tag-btn" onclick="selectCategory('Касса')">🛒 Касса</button>
            <button class="inline-tag-btn" onclick="selectCategory('Основное место продаж')">🏷️ Основное место продаж</button>
        `;
        addMessage("Здравствуйте! Выберите интересующий вас раздел из таблицы:", 'bot', buttons);
    }

    // Обработка выбора категории
    function selectCategory(category) {
        addMessage(category, 'user');

        if (category === 'КСО') {
            const buttons = `
                <button class="inline-tag-btn" onclick="selectKso('box')">Между двумя терминалами КСО есть музыкальный бокс?</button>
                <button class="inline-tag-btn" onclick="selectKso('no_box')">Между двумя терминалами нет музыкального бокса? Либо есть музыкальный бокс, НО между двумя терминалами есть тумба, шкаф или колона ?</button>
                <button class="inline-tag-btn" onclick="selectKso('empty')">У КСО вообще нет никакого оборудования ?</button>
                <button class="inline-tag-btn" onclick="selectKso('three_mixed')">У тебя три терминала, между двумя терминалами музыкальный бокс, у третьего тоже свой музыкальный бокс или нет музыкального бокса?</button>
                <button class="inline-tag-btn" onclick="selectKso('three_none')">Между двумя терминалами нет музыкального бокса?</button>
            `;
            setTimeout(() => addMessage("Выберите ситуацию по КСО:", 'bot', buttons), 300);
        } 
        else if (category === 'Касса') {
            const buttons = `
                <button class="inline-tag-btn" onclick="selectKassa('around')">Вокруг кассы можешь обойти?</button>
                <button class="inline-tag-btn" onclick="selectKassa('two_kassa')">Две кассы стоят рядом друг с другом или спиной друг к другу, и ты не можешь пройти между ними (между островами)?</button>
                <button class="inline-tag-btn" onclick="selectKassa('no_equipment')">У кассы вообще нет прикассового оборудования?</button>
                <button class="inline-tag-btn" onclick="selectKassa('magnit_cosmetic')">Ты вообще в магнит косметике?</button>
            `;
            setTimeout(() => addMessage("Выберите ситуацию по Кассе:", 'bot', buttons), 300);
        } 
        else if (category === 'Основное место продаж') {
            const buttons = `
                <button class="inline-tag-btn" onclick="selectOmp('net')">Буквально рядом со стеллажом весит панель сетка с бритвами (или щетками) ?</button>
                <button class="inline-tag-btn" onclick="selectOmp('display')">Перед тобой экспозитор, панель сетка, бразильская стойка, препак, или стеллаж с косметикой или уходовой косметикой ,но с нашими подарочными наборами?</button>
                <button class="inline-tag-btn" onclick="selectOmp('stripe')">Перед тобой страйп лента или навеска?</button>
                <button class="inline-tag-btn" onclick="selectOmp('gels_near')">Наши пены и гели + конкуренты, стоят только на стойке возле кассы, или стеллаже (или ДМП) за кассиром?</button>
                <button class="inline-tag-btn" onclick="selectOmp('gels_diff')">Пены и гели дорогие стоят на кассе, дешевые стоят в торговом зале?</button>
            `;
            setTimeout(() => addMessage("Выберите ситуацию по Основному месту продаж:", 'bot', buttons), 300);
        }
    }

    // Ответы по КСО
    function selectKso(type) {
        let reply = "";
        if (type === 'box') reply = "Выбирай «КСО узел» и делай фото двух терминалов в одну сцену";
        if (type === 'no_box') reply = "Выбирай «КСО» и делай фото одного терминала";
        if (type === 'empty') reply = "Выбирай «Пустая КСО», делай обзорное фото";
        if (type === 'three_mixed') reply = "Выбирай «КСО узел» фотографируй два терминала, а для третьего выбери «КСО»";
        if (type === 'three_none') reply = "Выбери «КСО» для каждого терминала";

        addMessage(event.target.textContent, 'user');
        setTimeout(() => {
            const resetHtml = `<button class="reset-btn" onclick="resetChat()">🔄 Вернуться в главное меню</button>`;
            addMessage(reply, 'bot', resetHtml);
        }, 300);
    }

    // Ответы по Кассе (с вложенной цепочкой для двух касс)
    function selectKassa(type) {
        const text = event.target.textContent;
        addMessage(text, 'user');

        if (type === 'two_kassa') {
            // Вложенный вопрос из таблицы для двух касс
            const subButtons = `
                <button class="inline-tag-btn" onclick="selectKassaSub('c_all')">Наш товар находится на стороне С+А1+А2? Либо только на стороне С?</button>
                <button class="inline-tag-btn" onclick="selectKassaSub('a1_a2')">Наш товар находится на стороне А1 и А2?</button>
            `;
            setTimeout(() => addMessage("Уточните расположение товара:", 'bot', subButtons), 300);
        } else {
            let reply = "";
            if (type === 'around') reply = "Выбирай «Одиночная прикасса» и выбери сторону А1 (даже если фоткаешь сторону С или А2 острова)";
            if (type === 'no_equipment') reply = "Выбирай «Пустая прикасса»";
            if (type === 'magnit_cosmetic') reply = "Выбери сторону С и делай фотки в одну сцену";

            setTimeout(() => {
                const resetHtml = `<button class="reset-btn" onclick="resetChat()">🔄 Вернуться в главное меню</button>`;
                addMessage(reply, 'bot', resetHtml);
            }, 300);
        }
    }

    // Вложенный выбор для двух касс
    function selectKassaSub(subType) {
        addMessage(event.target.textContent, 'user');
        let reply = "";
        if (subType === 'c_all') reply = "Выбирай сторону С и делай фото всех мест продаж в одну сцену";
        if (subType === 'a1_a2') reply = "Выбирай сторону А1 делай первое фото, затем нажми «Новая сцена» и выбери сторону А2 и делаешь второе фото";

        setTimeout(() => {
            const resetHtml = `<button class="reset-btn" onclick="resetChat()">🔄 Вернуться в главное меню</button>`;
            addMessage(reply, 'bot', resetHtml);
        }, 300);
    }

    // Ответы по Основному месту продаж
    function selectOmp(type) {
        let reply = "";
        if (type === 'net') reply = "Выбери «Основное место продаж»";
        if (type === 'display') reply = "Выбери «Дисплей»";
        if (type === 'stripe') reply = "Выбери «Диспенсер»";
        if (type === 'gels_near') reply = "Выбери «Основное место продаж», но не забудь сделать фото стеллажа с гигиеной в торговом зале";
        if (type === 'gels_diff') reply = "Выбери «Основное место продаж» для торгового зала, для кассы «Дисплей»";

        addMessage(event.target.textContent, 'user');
        setTimeout(() => {
            const resetHtml = `<button class="reset-btn" onclick="resetChat()">🔄 Вернуться в главное меню</button>`;
            addMessage(reply, 'bot', resetHtml);
        }, 300);
    }

    // Сброс и возврат в главное меню
    function resetChat() {
        chatBox.innerHTML = '';
        startMenu();
    }

    // Запуск при старте страницы
    window.onload = function() {
        startMenu();
    };
</script>

</body>
</html>
